<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recipe Finder</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav class="navbar navbar-dark bg-dark">
    <div class="container">
      <span class="navbar-brand mb-0 h1">🍲 Recipe Finder</span>
    </div>
  </nav>

  <div class="container mt-4">

    <div class="row mb-3">
      <div class="col-md-8">
        <form id="searchForm" class="d-flex">
          <input type="text" id="searchInput" class="form-control me-2" placeholder="Search a recipe (e.g. chicken, pasta)">
          <button class="btn btn-primary" type="submit">Search</button>
        </form>
      </div>
      <div class="col-md-4 text-md-end mt-2 mt-md-0">
        <button id="randomBtn" class="btn btn-outline-secondary">Random Recipe</button>
      </div>
    </div>

    <div id="categoryRow" class="mb-3"></div>

    <p id="status" class="text-muted"></p>

    <div id="resultsGrid" class="row g-3"></div>

  </div>

  <!-- Recipe Modal -->
  <div class="modal fade" id="recipeModal" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="modalTitle">Recipe</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body" id="modalBody">
          Loading...
        </div>
      </div>
    </div>
  </div>

  <footer class="text-center text-muted py-4 mt-4">
    <small>Data from TheMealDB API</small>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
